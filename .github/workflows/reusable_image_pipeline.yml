# Bakes the SD-card image.
#
# Technique: a privileged container holding a pre-decompressed Raspberry Pi OS
# image, loop-mounted and chrooted via qemu-aarch64-static, provisioned in
# cached stages.
#
# Read docs/sop/SOP-008 before changing anything here. In particular:
#   - never add continue-on-error to a publish step (a green run with no assets
#     is the worst possible outcome — it looks like success);
#   - never disable the capability gate to get a build through;
#   - never cache the inject stage (the version is baked in there).

name: Reusable Image Pipeline

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: "Full version string, e.g. 1.4.0 or 1.4.0-pr42.abc1234"
      publish:
        required: false
        type: boolean
        default: false
        description: "Publish an immutable release. False uploads an artifact only."
      run_tests:
        required: false
        type: boolean
        default: true
      runner_labels:
        required: false
        type: string
        default: '["self-hosted", "Linux", "ARM64"]'
        description: "JSON array of runner labels. Fall back to ubuntu-24.04-arm."
      compression_level:
        required: false
        type: number
        default: 3
        description: "zstd level. 3 for PR builds, 19 for releases."

permissions:
  contents: write
  packages: write

jobs:
  bake:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 120
    outputs:
      image: ${{ steps.names.outputs.image }}
      package: ${{ steps.names.outputs.package }}
    steps:
      - name: Install base dependencies
        run: sudo apt-get update && sudo apt-get install -y git python3 zstd qemu-user-static jq speedtest-cli

      # Cache uploads (the `actions/cache/save` steps below) compete with the
      # runner's own upload of the actual build artifact for the same
      # constrained, often-shared uplink. On a slow or bandwidth-capped
      # runner, spending that budget on a cache — which only ever saves time
      # on a *future* run, and only on a cache miss — isn't worth it over
      # spending it on the artifact this run actually needs to ship. Measure
      # once, gate every cache-save step in this job on it.
      - name: Measure uplink speed
        id: speedtest
        run: |
          set -euo pipefail
          RESULT="$(speedtest-cli --secure --simple)"
          echo "${RESULT}"
          UPLOAD_MBPS="$(echo "${RESULT}" | awk '/^Upload/{print $2}')"
          FAST=false
          if awk -v u="${UPLOAD_MBPS}" 'BEGIN{exit !(u > 100)}'; then
            FAST=true
          fi
          echo "Measured upload: ${UPLOAD_MBPS} Mbit/s (fast_uplink=${FAST})"
          echo "upload_mbps=${UPLOAD_MBPS}" >> "$GITHUB_OUTPUT"
          echo "fast_uplink=${FAST}" >> "$GITHUB_OUTPUT"

      # head.sha, not head.ref: a branch name is racy and resolves wrong for
      # forks. Gutiva's oracle pipeline already does this; its firmware pipeline
      # does not, and that is a bug we are not inheriting.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Compute asset names
        id: names
        run: |
          echo "image=wifucked-${{ inputs.version }}-arm64.img" >> "$GITHUB_OUTPUT"
          echo "package=wifucked-${{ inputs.version }}.wtf" >> "$GITHUB_OUTPUT"

      # The dashboard must work with no Internet. Fail before spending an hour
      # baking an image whose UI needs a CDN.
      - name: Airgap gate
        run: python3 appliance/tests/verify_no_external_assets.py appliance

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Restore builder image cache
        id: builder-cache
        uses: actions/cache/restore@v4
        with:
          path: builder.tar.zst
          key: builder-${{ runner.os }}-${{ hashFiles('.github/builder.Dockerfile') }}

      - name: Load cached builder
        if: steps.builder-cache.outputs.cache-hit == 'true'
        run: |
          zstd -d -T0 builder.tar.zst -o builder.tar
          docker load -i builder.tar
          rm builder.tar

      - name: Build builder
        if: steps.builder-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .github
          file: .github/builder.Dockerfile
          load: true
          tags: wifucked-builder:latest

      - name: Save builder
        if: steps.builder-cache.outputs.cache-hit != 'true'
        run: |
          docker save wifucked-builder:latest -o builder.tar
          zstd -T0 -3 builder.tar -o builder.tar.zst
          rm builder.tar

      - name: Save builder image cache
        if: steps.builder-cache.outputs.cache-hit != 'true' && steps.speedtest.outputs.fast_uplink == 'true'
        uses: actions/cache/save@v4
        with:
          path: builder.tar.zst
          key: ${{ steps.builder-cache.outputs.cache-primary-key }}

      # Stage A is the slow one — all the apt work happens here — and the only
      # one worth caching. Keyed on what actually changes it.
      - name: Restore base image cache
        id: base-cache
        uses: actions/cache/restore@v4
        with:
          path: raspios-base.img.zst
          key: base-${{ runner.os }}-${{ hashFiles('.github/builder.Dockerfile', 'appliance/setup_rpi.sh', 'appliance/apt_deps.txt') }}

      - name: Stage A — provision base image
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          CID=$(docker run -d --privileged -v /dev:/dev wifucked-builder:latest sleep infinity)
          docker cp appliance "${CID}:/workspace-appliance"
          docker exec -i "${CID}" bash <<'INNER'
          set -euo pipefail

          # Containerised runners have no udev, so loop and partition nodes must
          # be created by hand.
          for i in $(seq 0 63); do
            [ -b /dev/loop$i ] || mknod /dev/loop$i b 7 $i
          done

          mkdir -p /build
          cp /raspios.img /build/base.img
          # 6G leaves room for two version slots plus telemetry.
          qemu-img resize -f raw /build/base.img 6G
          parted -s /build/base.img resizepart 2 100%

          LOOP=$(losetup --find --show -P /build/base.img)
          udevadm settle || true
          NAME=$(basename "${LOOP}")
          for i in $(seq 1 8); do
            if [ -f /sys/class/block/${NAME}p${i}/dev ]; then
              IFS=: read -r major minor < /sys/class/block/${NAME}p${i}/dev
              [ -b /dev/${NAME}p${i} ] || mknod /dev/${NAME}p${i} b "${major}" "${minor}"
            fi
          done

          e2fsck -f -y "${LOOP}p2" || true
          resize2fs "${LOOP}p2"

          mkdir -p /mnt/rpi
          mount "${LOOP}p2" /mnt/rpi
          mount "${LOOP}p1" /mnt/rpi/boot
          for d in dev sys proc dev/pts; do mount --bind /$d /mnt/rpi/$d; done
          echo "nameserver 1.1.1.1" > /mnt/rpi/etc/resolv.conf

          cp /usr/bin/qemu-aarch64-static /mnt/rpi/usr/bin/
          chmod +x /mnt/rpi/usr/bin/qemu-aarch64-static

          mkdir -p /mnt/rpi/tmp/repo
          cp -r /workspace-appliance/. /mnt/rpi/tmp/repo/
          echo "force-unsafe-io" > /mnt/rpi/etc/dpkg/dpkg.cfg.d/force-unsafe-io

          chroot /mnt/rpi /usr/bin/qemu-aarch64-static /bin/bash -c \
            'REPO=/tmp/repo /tmp/repo/setup_rpi.sh'

          rm -f /mnt/rpi/etc/dpkg/dpkg.cfg.d/force-unsafe-io
          for d in dev/pts dev sys proc boot ''; do umount -l /mnt/rpi/$d || true; done
          losetup -d "${LOOP}"

          zstd -T0 -3 /build/base.img -o /raspios-base.img.zst
          rm -rf /build
          INNER
          docker cp "${CID}:/raspios-base.img.zst" .
          docker rm -f "${CID}"

      - name: Save base image cache
        if: steps.base-cache.outputs.cache-hit != 'true' && steps.speedtest.outputs.fast_uplink == 'true'
        uses: actions/cache/save@v4
        with:
          path: raspios-base.img.zst
          key: ${{ steps.base-cache.outputs.cache-primary-key }}

      - name: Stage B — build update package
        run: ./scripts/build_package.sh "${{ inputs.version }}" "${{ steps.names.outputs.package }}"

      # Stage C is deliberately NOT cached. The version is injected here, so a
      # tree-hash cache would let a PR build (X.Y.Z-pr42) and a main build
      # (X.Y.Z) of an identical tree share an entry — and ship a release whose
      # baked-in version reads -pr42. Gutiva has exactly this bug.
      - name: Stage C — inject application and verify capability
        run: |
          set -euo pipefail
          CID=$(docker run -d --privileged -v /dev:/dev wifucked-builder:latest sleep infinity)
          docker cp raspios-base.img.zst "${CID}:/raspios-base.img.zst"
          docker cp "${{ steps.names.outputs.package }}" "${CID}:/update.wtf"
          docker exec -i -e VERSION="${{ inputs.version }}" \
                          -e COMMIT="${{ github.sha }}" \
                          -e BUILD="${{ github.run_number }}" "${CID}" bash <<'INNER'
          set -euo pipefail
          for i in $(seq 0 63); do [ -b /dev/loop$i ] || mknod /dev/loop$i b 7 $i; done

          mkdir -p /build
          zstd -d -T0 /raspios-base.img.zst -o /build/final.img
          LOOP=$(losetup --find --show -P /build/final.img)
          NAME=$(basename "${LOOP}")
          for i in $(seq 1 8); do
            if [ -f /sys/class/block/${NAME}p${i}/dev ]; then
              IFS=: read -r major minor < /sys/class/block/${NAME}p${i}/dev
              [ -b /dev/${NAME}p${i} ] || mknod /dev/${NAME}p${i} b "${major}" "${minor}"
            fi
          done

          mkdir -p /mnt/rpi
          mount "${LOOP}p2" /mnt/rpi
          for d in dev sys proc dev/pts; do mount --bind /$d /mnt/rpi/$d; done

          mkdir -p /mnt/rpi/tmp/pkg
          cp /update.wtf /mnt/rpi/tmp/pkg/
          chroot /mnt/rpi /usr/bin/qemu-aarch64-static /bin/bash -c \
            'cd /tmp/pkg && unzip -qo update.wtf && chmod +x update.sh && ./update.sh'

          # What the device knows about itself (ADR-016).
          cat > /mnt/rpi/etc/wifucked-release <<RELEASE
          WIFUCKED_VERSION=${VERSION}
          WIFUCKED_COMMIT=$(echo "${COMMIT}" | cut -c1-7)
          WIFUCKED_BUILD=${BUILD}
          WIFUCKED_BUILT_AT=$(date -u +%FT%TZ)
          WIFUCKED_CHANNEL=main
          WIFUCKED_FABRIC_MIN=${WIFUCKED_FABRIC_MIN:-0.1.0}
          RELEASE

          # Capability gate. An image that cannot shape traffic or move the AP
          # channel cannot do its job — fail here rather than shipping it.
          echo "--- capability gate"
          chroot /mnt/rpi /usr/bin/qemu-aarch64-static /bin/bash -c '
            set -e
            # See appliance/setup_rpi.sh: uname -r inside the chroot reports
            # the host kernel, not the Pi one, so modinfo needs -k pointed at
            # the kernel version actually installed in the image.
            KVER=$(find /lib/modules -mindepth 1 -maxdepth 1 -printf "%f\n" | head -n1)
            modinfo -k "${KVER}" sch_cake  > /dev/null || { echo "FATAL: sch_cake missing";  exit 1; }
            modinfo -k "${KVER}" wireguard > /dev/null || { echo "FATAL: wireguard missing"; exit 1; }
            # ADR-025: download shaping redirects ingress through an IFB
            # device onto a second CAKE qdisc — without this module, that
            # redirect silently has nowhere to go and download simply never
            # gets shaped, exactly the kind of failure this gate exists to
            # catch at build time instead of on a device in the field.
            modinfo -k "${KVER}" ifb        > /dev/null || { echo "FATAL: ifb missing";      exit 1; }
            command -v nft     > /dev/null || { echo "FATAL: nft missing";     exit 1; }
            command -v tc      > /dev/null || { echo "FATAL: tc missing";      exit 1; }
            command -v hostapd > /dev/null || { echo "FATAL: hostapd missing"; exit 1; }
            command -v dnsmasq > /dev/null || { echo "FATAL: dnsmasq missing"; exit 1; }
            test -f /opt/wifucked/current/src/wifucked/__init__.py || { echo "FATAL: app not installed"; exit 1; }
            echo "capability gate: OK"
          '

          # The AP must not depend on the daemon (ADR-011). Assert it in the
          # image rather than discovering otherwise on a device.
          echo "--- anchor gate"
          if grep -qE '^(Requires|BindsTo|PartOf)=.*wifucked\.service' \
               /mnt/rpi/etc/systemd/system/hostapd.service.d/*.conf 2>/dev/null; then
            echo "FATAL: hostapd depends on wifucked.service — the AP must be the anchor"
            exit 1
          fi
          echo "anchor gate: OK"

          rm -rf /mnt/rpi/tmp/pkg
          for d in dev/pts dev sys proc ''; do umount -l /mnt/rpi/$d || true; done
          losetup -d "${LOOP}"
          mv /build/final.img /wifucked.img
          rm -rf /build
          INNER
          docker cp "${CID}:/wifucked.img" "${{ steps.names.outputs.image }}"
          docker rm -f "${CID}"

      # Everything above proves the image *contains* the right binaries
      # (capability gate) and the right static config (anchor gate) — it has
      # never proven the image actually *boots*. This attempts to boot the
      # literal bytes this job is about to publish, under
      # qemu-system-aarch64, and confirm wifucked.service reaches its own
      # started state — the closest thing to "flash it and watch it come
      # up" this pipeline can do without a real Pi. Real WiFi (brcmfmac)/
      # USB OTG are not emulated by QEMU's raspi machine models, so this
      # cannot and does not attempt to confirm AP bring-up or WAN behavior —
      # appliance/tests/e2e/'s generic-hardware proof already covers that
      # real behavior far more thoroughly than raspi3b peripheral emulation
      # could.
      #
      # STATUS: non-blocking, not yet working. Real CI has confirmed the
      # kernel/dtb extracted from the actual artifact are structurally
      # valid and loadable (QEMU genuinely executes them — real BCM2835
      # mailbox/property probes, real hardware register writes visible via
      # -d guest_errors,unimp), but the guest never produces any of its own
      # console output and the run ends in a BCM2835 watchdog register
      # write ~15-35s in, every attempt, unaffected by console-routing
      # fixes (baud rate, -nographic, dual console= targets), CPU model, or
      # panic=0/earlycon. The evidence points at QEMU raspi3b's SD
      # controller emulation ("SD: Unknown CMD52/CMD5 for spec v2.00" —
      # this kernel's exact MMC negotiation sequence) rather than anything
      # this repo controls, but that is a hypothesis, not confirmed the way
      # every other claim in this codebase's docs/active-tests.md is
      # expected to be — flagged there rather than asserted here.
      # `continue-on-error` so a still-unresolved diagnostic doesn't block
      # real releases; remove it once this actually reaches "Started
      # WI-FUCKED connectivity controller".
      - name: Boot-smoke-test the actual released image (real qemu-system-aarch64)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-utils

          IMG="${{ steps.names.outputs.image }}"
          WORK="$(mktemp -d)"

          LOOP="$(sudo losetup --find --show -P "${IMG}")"
          sudo mkdir -p "${WORK}/boot"
          sudo mount -o ro "${LOOP}p1" "${WORK}/boot"

          KERNEL="${WORK}/boot/kernel8.img"
          if [ ! -f "${KERNEL}" ]; then
            echo "FATAL: no kernel8.img on the boot partition"
            ls -la "${WORK}/boot"
            exit 1
          fi

          # The Zero 2W's SoC (RP3A0) is the same BCM2837 family QEMU's
          # raspi3b machine models — try the Zero 2W's own devicetree first,
          # fall back to the Pi 3B's (electrically/architecturally close
          # enough for CPU/kernel boot, which is all this step needs; it
          # never touches real WiFi/USB peripherals either way).
          DTB=""
          for candidate in bcm2837-rpi-zero-2-w.dtb bcm2710-rpi-zero-2-w.dtb bcm2710-rpi-3-b-plus.dtb bcm2710-rpi-3-b.dtb; do
            if [ -f "${WORK}/boot/${candidate}" ]; then
              DTB="${WORK}/boot/${candidate}"
              break
            fi
          done
          if [ -z "${DTB}" ]; then
            echo "FATAL: no usable devicetree found on the boot partition"
            ls -la "${WORK}/boot"/*.dtb
            exit 1
          fi
          echo "Using kernel=${KERNEL} dtb=${DTB}"
          cp "${KERNEL}" "${WORK}/kernel8.img"
          cp "${DTB}" "${WORK}/board.dtb"
          sudo umount "${WORK}/boot"
          sudo losetup -d "${LOOP}"

          # QEMU's raspi3b SD controller emulation requires an exact
          # power-of-2 image size ("Invalid SD card size: 6 GiB... has to be
          # a power of 2") — the real published artifact isn't shaped this
          # way (it's sized to the actual partition contents, not a round
          # number), so grow a *copy* to 8 GiB rather than touching
          # `${IMG}` itself, which "Compress and checksum" (next step)
          # publishes unmodified.
          BOOT_IMG="${WORK}/boot-test.img"
          cp --reflink=auto "${IMG}" "${BOOT_IMG}" 2>/dev/null || cp "${IMG}" "${BOOT_IMG}"
          qemu-img resize -f raw "${BOOT_IMG}" 8G

          CONSOLE="${WORK}/console.log"
          touch "${CONSOLE}"
          set +e
          # Three real CI attempts (varying -serial/-display vs -nographic,
          # explicit baud rate, explicit CPU model) all produced a clean
          # qemu exit (code 0) at ~30-35s with zero console output — not a
          # kernel panic, nothing ever printed at all. The likely cause:
          # models with onboard Bluetooth (the Zero 2W has it) default the
          # good PL011 UART to Bluetooth and route console to the
          # mini-UART (`ttyS0`) instead — on real hardware this is resolved
          # by a firmware-applied dtoverlay from `config.txt` (`serial0`
          # symlink pointing at whichever UART actually owns console), but
          # `-kernel`/`-dtb` boot bypasses the firmware/config.txt stage
          # entirely, so that resolution never happens here. Register both
          # possible targets rather than guess which one this specific
          # devicetree wires up.
          timeout 300 qemu-system-aarch64 \
            -M raspi3b -cpu cortex-a53 -m 1024 -smp 4 \
            -d guest_errors,unimp \
            -kernel "${WORK}/kernel8.img" -dtb "${WORK}/board.dtb" \
            -append "console=ttyS0,115200 console=ttyAMA0,115200 root=/dev/mmcblk0p2 rootfstype=ext4 rootwait rw panic=0 earlycon" \
            -drive file="${BOOT_IMG}",format=raw,if=sd \
            -nographic -no-reboot > "${CONSOLE}" 2>&1
          QEMU_RC=$?
          set -e

          echo "--- boot console (last 300 lines) ---"
          tail -300 "${CONSOLE}" || true
          echo "--- (qemu exit code: ${QEMU_RC}) ---"

          if ! grep -q "Started WI-FUCKED connectivity controller" "${CONSOLE}"; then
            echo "FATAL: wifucked.service never reached its started state on the actual released image"
            exit 1
          fi
          echo "boot-smoke-test: OK — wifucked.service started on the real released image under qemu-system-aarch64"

      - name: Compress and checksum
        run: |
          set -euo pipefail
          zstd -T0 -${{ inputs.compression_level }} --rm \
            "${{ steps.names.outputs.image }}" -o "${{ steps.names.outputs.image }}.zst"
          sha256sum "${{ steps.names.outputs.image }}.zst" \
                    "${{ steps.names.outputs.package }}" > SHA256SUMS
          cat SHA256SUMS

      - name: Generate manifest
        run: |
          ./scripts/gen_manifest.sh \
            "${{ inputs.version }}" \
            "${{ steps.names.outputs.image }}.zst" \
            "${{ steps.names.outputs.package }}"

      - name: Upload artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: wifucked-${{ inputs.version }}
          retention-days: 14
          path: |
            ${{ steps.names.outputs.image }}.zst
            ${{ steps.names.outputs.package }}
            manifest.json
            SHA256SUMS

      # No continue-on-error. A publish failure must fail the run — a green run
      # with no assets is worse than a red one.
      - name: Publish immutable release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.names.outputs.image }}.zst
            ${{ steps.names.outputs.package }}
            manifest.json
            SHA256SUMS

  fabric:
    # Two ends of one protocol: they ship together, at the same version.
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # cache-to below uploads every layer (mode=max) to the GHA cache
      # backend — real bytes over the same constrained uplink the artifact
      # itself needs. cache-from (restore, a download) stays unconditional;
      # only the upload is worth gating. See the identical step in the
      # `bake` job above for the full rationale.
      - name: Measure uplink speed
        id: speedtest
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -qq -y speedtest-cli
          RESULT="$(speedtest-cli --secure --simple)"
          echo "${RESULT}"
          UPLOAD_MBPS="$(echo "${RESULT}" | awk '/^Upload/{print $2}')"
          FAST=false
          if awk -v u="${UPLOAD_MBPS}" 'BEGIN{exit !(u > 100)}'; then
            FAST=true
          fi
          echo "Measured upload: ${UPLOAD_MBPS} Mbit/s (fast_uplink=${FAST})"
          echo "upload_mbps=${UPLOAD_MBPS}" >> "$GITHUB_OUTPUT"
          echo "fast_uplink=${FAST}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default "docker" driver can't export a GHA cache; docker-container
      # can. Without this, cache-to below fails the build outright.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push fabric
        uses: docker/build-push-action@v6
        with:
          context: fabric
          push: ${{ inputs.publish }}
          load: true
          build-args: |
            FABRIC_VERSION=${{ inputs.version }}
          tags: ghcr.io/${{ steps.repo.outputs.name }}/fabric:${{ inputs.version }}
          cache-from: type=gha
          cache-to: ${{ steps.speedtest.outputs.fast_uplink == 'true' && 'type=gha,mode=max' || '' }}

      # Confirms fabric.__version__ actually got the real version baked in,
      # and that it clears WIFUCKED_FABRIC_MIN (0.1.0) — the floor
      # appliance/tunnel/__init__.py:fabric_compatible() enforces at attach
      # time. Catches exactly the bug this job used to ship silently: every
      # fabric image reporting "0.0.0-dev", which fails that check.
      - name: Verify injected fabric version
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python \
            "ghcr.io/${{ steps.repo.outputs.name }}/fabric:${{ inputs.version }}" -c '
          from fabric import __version__
          expected = "${{ inputs.version }}"
          assert __version__ == expected, f"baked version {__version__!r} != {expected!r}"
          core = tuple(int(p) for p in __version__.split("-", 1)[0].split("+", 1)[0].split("."))
          assert core >= (0, 1, 0), f"baked version {__version__} fails WIFUCKED_FABRIC_MIN=0.1.0"
          print(f"fabric version OK: {__version__}")
          '
