# Pull-request CI. Never publishes a release.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and fails fast. The release version is derived from commit
  # subjects, so a malformed one silently mis-versions a release (ADR-017).
  commitlint:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|perf|refactor|docs|test|build|ci|chore)(\([a-z0-9._-]+\))?!?: .+'
          FAILED=0

          while IFS= read -r subject; do
            [ -z "${subject}" ] && continue
            # Merge commits are generated, not authored.
            case "${subject}" in "Merge "*) continue ;; esac
            if ! echo "${subject}" | grep -qE "${PATTERN}"; then
              echo "::error::Not a conventional commit: ${subject}"
              FAILED=1
            fi
          done < <(git log --format='%s' origin/${{ github.base_ref }}..HEAD)

          if [ "${FAILED}" -ne 0 ]; then
            echo ""
            echo "Format: <type>(<scope>): <subject>"
            echo "Types:  feat fix perf refactor docs test build ci chore"
            echo "See docs/sop/SOP-005-commits-and-pull-requests.md"
            exit 1
          fi
          echo "All commit subjects are conventional."

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install --quiet ruff

      - name: Ruff
        run: |
          ruff check appliance/src fabric/src appliance/tests fabric/tests
          ruff format --check appliance/src fabric/src appliance/tests fabric/tests

      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck appliance/*.sh scripts/*.sh appliance/stage-custom/opt/wifucked/*.sh fabric/*.sh

      - name: Actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet -r appliance/requirements-dev.txt

      # No hardware anywhere in the suite. A test that needs a Pi is a design
      # problem, not a constraint (SOP-003).
      - name: Run tests
        run: ./run_all_tests.sh

  # Boots a real Debian guest under QEMU and runs the actual
  # appliance/setup_rpi.sh (the real image-bake provisioning script) live,
  # which brings up real hostapd, real dnsmasq, real systemd-networkd, real
  # NetworkManager (with the real unmanaged-devices config), and
  # wifucked.service itself with no MOCK_HW override — the real Linux HAL.
  # mac80211_hwsim gives the guest a literal wlan0; a second radio in its own
  # netns inside the same guest kernel plays a real Wi-Fi client: real
  # association, a real DHCP lease, a real ping, and a real headless
  # Chromium (Playwright) at the real dashboard. Catches exactly what the
  # unit/scenario suite above cannot — hostapd up, but the OS-level
  # networking or the dashboard unreachable — at the real config-and-service
  # layer, not a mock of it. See appliance/tests/e2e/README.md. Needs root
  # for QEMU/network-namespace setup on the host, so it runs as its own job
  # rather than inside run_all_tests.sh (SOP-003).
  e2e-ap-dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU + image-building tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage dosfstools mtools rsync zip dnsmasq iptables wireguard-tools nftables python3-venv conntrack tcpdump

      # Cached across runs — this is a ~300 MB base image download that never
      # changes unless Debian ships a new bookworm point release.
      - name: Cache the Debian base image
        uses: actions/cache@v4
        with:
          path: appliance/tests/e2e/.work
          key: wifucked-e2e-debian-bookworm-generic-amd64

      - name: Run the AP + dashboard E2E proof
        run: |
          sudo appliance/tests/e2e/run_e2e_ap_test.sh "${GITHUB_WORKSPACE}/e2e-artifacts"

      - name: Upload E2E artifacts (report, screenshots, console/service logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ap-dashboard-results
          path: e2e-artifacts/
          retention-days: 30

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A real SemVer prerelease, so it sorts below the release it precedes and
      # an OTA client can never mistake it for something shipped (ADR-016).
      - name: Compute version
        id: next
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/next_version.sh --github --pr "${{ github.event.pull_request.number }}"
          else
            ./scripts/next_version.sh --github --rc
          fi

  bake:
    needs: [lint, test, e2e-ap-dashboard, version]
    uses: ./.github/workflows/reusable_image_pipeline.yml
    permissions:
      contents: write
      packages: write
    with:
      version: ${{ needs.version.outputs.version }}
      publish: false
      compression_level: 3
      runner_labels: '["ubuntu-24.04-arm"]'
