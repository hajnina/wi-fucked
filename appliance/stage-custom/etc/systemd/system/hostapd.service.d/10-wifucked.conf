# The AP is the anchor (ADR-011) — hostapd must come up on its own, every
# time, with no daemon involved. Two failure modes observed on real hardware
# produced "no SSID, ever, no error visible anywhere" and neither is fixed by
# retrying hostapd's own startup logic:
#
#   1. The radio can boot rfkill soft-blocked. Nothing on a fresh Raspberry Pi
#      OS image guarantees wlan is unblocked before hostapd's first start —
#      wpa_supplicant normally does this as a side effect, but wlan0 is
#      deliberately unmanaged by NetworkManager here (setup_rpi.sh) so nothing
#      ever runs it. A blocked radio fails nl80211 driver init silently.
#   2. If NetworkManager's unmanaged-devices list ever drifts out of sync with
#      the actual AP interface name again, wpa_supplicant can grab wlan0
#      before hostapd binds it. Ordering after NetworkManager narrows that
#      race; it does not replace fixing the unmanaged-devices list itself.

[Unit]
After=NetworkManager.service

[Service]
ExecStartPre=-/usr/sbin/rfkill unblock wlan
Restart=on-failure
RestartSec=2
